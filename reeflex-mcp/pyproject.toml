[build-system]
# UPPER BOUND: the API surface this file uses from setuptools is the PEP 517
# `build_meta` backend plus two config tables ([tool.setuptools.packages.find]
# and [tool.setuptools.package-data]). The ceiling is one major above the
# version release.yml actually builds the published wheel with (84.0.0 as of
# 2026-09-08) — setuptools removes things across majors, and an open floor here
# means the artefact a customer installs was built by a backend nobody chose.
# Raise it deliberately, after a `python -m build` on all three packages.
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-mcp"
version = "0.1.3"
description = "Reeflex MCP gateway -- a transparent MCP proxy that governs any MCP upstream: intercepts tools/call, normalizes it into a Reeflex Action Envelope, asks reeflex-core /v1/decide, and enforces the verdict. Zero LLM in the decision path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reeflex" }]
keywords = ["reeflex", "mcp", "governance", "gateway", "ai-agents", "adapter"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# reeflex-core stays dependency-free by contract; this is a thin MCP surface
# package. `mcp` is the official SDK (the standard way to speak the protocol
# on both the front -- FastMCP -- and back -- ClientSession -- sides); `pyyaml`
# reads the operator-owned reeflex-mcp.yaml registry (SPEC section 7 in the
# design doc). Both are the minimum needed; reeflex-core-facing HTTP stays
# stdlib-only (see core_client.py). `anyio` was already a transitive `mcp`
# dependency (>=4.5); pinned explicitly now that upstream.py imports it
# directly (CancelScope(shield=True) around upstream teardown -- BUG 1 fix).
#
# EVERY FLOOR HERE IS BOUNDED ABOVE, AND EACH BOUND IS JUSTIFIED BY THE API
# SURFACE THIS PACKAGE USES (the sweep PR #123 asked for). The lesson that
# forced it: reeflex-holds shipped `mcp>=2`, mcp 2.1.1 arrived, and a SDK MINOR
# changed what our users see -- an operator could no longer tell a typo from an
# outage -- on a commit that touched none of this repo. A dependency whose minor
# releases can change our behaviour is not one to leave open-ended.
#
#   mcp>=1.2,<2   the FastMCP (front) + ClientSession (back) API. 2.0.0 removed
#                 mcp.server.fastmcp outright, so <2 is not caution, it is the
#                 boundary of what this package can import at all. Unchanged.
#   pyyaml>=6,<7  used surface: yaml.safe_load, yaml.YAMLError, and
#                 yaml.safe_dump(..., sort_keys=False, default_flow_style=False)
#                 (registry.py, mappings.py). `sort_keys` on safe_dump needs
#                 >=5.1; the floor is >=6 because 6.0 is the first release that
#                 supports this package's own requires-python (>=3.10). 6.x is
#                 the only major with these signatures (latest 6.0.3), so <7.
#                 It had NO floor and NO ceiling before this change -- and
#                 reeflex-mcp 0.1.3 is on PyPI today declaring exactly that.
#   anyio>=4.5,<5 used surface: anyio.CancelScope(shield=True) (upstream.py) and
#                 anyio.fail_after (tests). Both are the 4.x API; >=4.5 is what
#                 mcp itself requires. Latest is 4.15.1, so <5 bounds the next
#                 major without excluding anything we run on.
dependencies = [
    "mcp>=1.2,<2",
    "pyyaml>=6,<7",
    "anyio>=4.5,<5",
]

[project.urls]
Homepage = "https://reeflex.io"
Repository = "https://github.com/Reeflex-io/reeflex"

[project.scripts]
reeflex-mcp = "reeflex_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["reeflex_mcp*"]

# Track 4 (design doc section 8): the 3 bundled starter declarative mappings
# (filesystem/github/postgres) ship as package data so `mappings.load_mappings_dir()`
# finds them in a real wheel install, not just an editable/source checkout.
[tool.setuptools.package-data]
reeflex_mcp = ["mappings/*.yaml"]

# NOTE: publishing this package to PyPI is a GATE (human GO) -- the same policy as
# every other Reeflex package. It is performed by the release workflow on a tag
# push, not by authoring. reeflex-core emits decision_id (SPEC section 5), so the
# release is unblocked; the gateway tags every allowed action with it.
