# reeflex-core deployment stack (minimal: one service).
# Host port is parameterized — set REEFLEX_HOST_PORT to the free port chosen on the VM.
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: reeflex-core:0.1
    container_name: reeflex-core
    environment:
      REEFLEX_HOST: "0.0.0.0"
      REEFLEX_PORT: "8080"
      # ---------------------------------------------------------------------------
      # WHO MAY SAY "A HUMAN APPROVED THIS" (RFX-84).
      # The image already sets REEFLEX_REQUIRE_VERIFIED_APPROVER=true, so a hold
      # cannot be resolved by an approver core cannot authenticate. To make an
      # approver verifiable, bind each one's bearer token to the principal it IS
      # (JSON inline, or a path to a JSON file; re-read per request, no restart):
      #
      # REEFLEX_RESOLVER_TOKENS: '{"tok_live_alice": {"type": "human", "id": "alice@example.com"}}'
      #
      # ESCAPE HATCH — upgrading from 0.1.x and not yet wired up? This restores the
      # old behaviour: holds resolve on a self-asserted approver, and every record
      # says decided_by_verified=false, so the report cannot claim four-eyes.
      # REEFLEX_REQUIRE_VERIFIED_APPROVER: "false"
      # ---------------------------------------------------------------------------
      # ---------------------------------------------------------------------------
      # SIEM / syslog telemetry — disabled by default.
      # Uncomment and set REEFLEX_SYSLOG_ADDRESS to enable.
      # Full guide: docs/siem.md
      # ---------------------------------------------------------------------------
      # REEFLEX_SYSLOG_ENABLED: "true"       # Master switch (default: false)
      # REEFLEX_SYSLOG_ADDRESS: "collector:514" # host:port of your syslog receiver
      # REEFLEX_SYSLOG_PROTOCOL: "udp"       # udp | tcp | tls  (default: udp)
      # REEFLEX_SYSLOG_FORMAT: "json"        # json | cef        (default: json)
      # REEFLEX_SYSLOG_FACILITY: "local0"    # syslog facility   (default: local0)
      # REEFLEX_SYSLOG_TLS_VERIFY: "true"    # tls only: verify CA (default: true)
    # -------------------------------------------------------------------------
    # STATE THAT MUST OUTLIVE THE CONTAINER (RFX-197).
    #
    # /app/audit holds two things, and until RFX-197 this file mounted NEITHER:
    #
    #   decisions.jsonl  the append-only audit log — the Art.14 evidence trail.
    #   ledger.jsonl     the per-session cumulative ledger — the thing R5's
    #                    budgets are enforced against, i.e. the substance of the
    #                    "fragmentation buys nothing" guarantee.
    #
    # With no volume both live in the container's writable layer, so
    # `docker compose up --force-recreate`, an image upgrade, or any orchestrator
    # that replaces the container starts every session's spend again from zero.
    # Measured before this change: replay the same session_id after a recreate
    # and the full delete budget is available again, with no human, no privilege
    # and nothing in the audit log saying it happened.
    #
    # A NAMED VOLUME IS THE ENFORCEMENT BOUNDARY, NOT A CONVENIENCE. Remove it
    # and the product silently returns to the RFX-197 behaviour.
    volumes:
      - reeflex-state:/app/audit
    ports:
      - "${REEFLEX_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# -----------------------------------------------------------------------------
# RFX-197 — SCALING THIS STACK OUT NEEDS ONE MORE THING THAN A `deploy.replicas`.
#
# The named volume below makes ONE core remember across restarts, and it makes
# several cores SHARE one budget only if they all mount THE SAME volume and that
# volume is genuinely shared. That holds for replicas on one host, which is what
# this file describes. It does NOT hold for replicas on separate hosts, or for a
# ReadWriteOnce PVC per pod: each then keeps its own ledger and each therefore
# grants a full session budget, so N replicas multiply every cumulative budget
# by N. A file cannot fix that; the shared-store upgrade (docs/roadmap.md, the
# Postgres-backed ledger) can.
#
# Until it lands, this is checkable rather than assumed: GET /healthz reports
# `ledger.durable` and `ledger.path`, and every core writes a `ledger_epoch`
# event to the audit stream at boot saying what it restored. Replicas that do
# not agree are visible, not silent.
volumes:
  reeflex-state:
