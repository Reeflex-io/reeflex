[build-system]
# UPPER BOUND (the sweep PR #123 asked for). This package has NO runtime
# dependencies -- it is stdlib-only, which is why `pip show reeflex-claude` has
# nothing to resolve and smoke-pypi.yml skips its `pip show mcp` line. But the
# BUILD backend is still a dependency on something we do not own: the surface
# used is the PEP 517 `build_meta` entry point plus
# [tool.setuptools.packages.find]. The ceiling is one major above the version
# release.yml builds the published wheel with (84.0.0 as of 2026-09-08).
requires = ["setuptools>=68.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-claude"
# 0.2.1 -> 0.2.2 because THIS COMMIT CHANGES WHAT THE PACKAGE DECIDES, and the
# v0.2.2 tag published 0.2.1 to the index at 2026-09-20T00:40:27Z.  Leaving the
# string at 0.2.1 makes the tree a CONTENT COLLISION against the wheel a
# customer already installs: `scripts/check_published_content.py` measured it
# here as "same version string, 132 differing lines across 1 files", and its
# remedy line is the only one available -- a lag FLAG cannot suppress a
# collision, only an UNPUBLISHED version can (see that script's THREE OUTCOMES
# docblock).  Under 0.2.2 the tree reads UNPUBLISHED, which that docblock calls
# the normal healthy state between a bump and its release.
#
# This bump does NOT publish anything and is not a release: the tag is the
# owner's call.  Until that tag, the index keeps serving 0.2.1 and a customer's
# `pip install reeflex-claude` keeps getting a classifier WITHOUT the RFX-356
# tie-break -- the reordering fail-open stays open for installed seats, and the
# merge is not the delivery.
version = "0.2.2"
description = "Reeflex adapter for Claude Code: a PreToolUse hook that gates every tool call on its impact before it runs (allow/hold/deny), fail-closed -- governance that protects you from your own agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
keywords = ["reeflex", "governance", "claude-code", "ai-agent-safety", "pretooluse-hook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://reeflex.io"
Source = "https://github.com/Reeflex-io/reeflex"
Issues = "https://github.com/Reeflex-io/reeflex/issues"
Documentation = "https://github.com/Reeflex-io/reeflex/tree/main/reeflex-claude"
Changelog = "https://github.com/Reeflex-io/reeflex/blob/main/CHANGELOG.md"

[project.scripts]
reeflex-claude = "reeflex_claude.cli:main"

[tool.setuptools.packages.find]
include = ["reeflex_claude*"]
