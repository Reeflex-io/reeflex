[build-system]
# Bounded above, matching the sweep in monorepo PR #129 (RFX-237).
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-openhands"
version = "0.1.0"
description = "Reeflex as an OpenHands security analyzer: every action an OpenHands SDK agent proposes is decided by a Reeflex gate (allow / hold / deny) before it runs, holds are resolved from the Reeflex portal, and every decision is recorded as signed evidence."
readme = "README.md"
license = "Apache-2.0"
# openhands-sdk itself declares Requires-Python >=3.12 (read from the installed
# 1.56.0 metadata, 2026-10-21), so a lower floor here would advertise an
# install that cannot resolve.
requires-python = ">=3.12"
keywords = ["reeflex", "governance", "openhands", "security-analyzer", "ai-agent-safety", "tool-calls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# TWO dependencies, and why each one.
#
# openhands-sdk: the seam. `ReeflexSecurityAnalyzer` subclasses
# `openhands.sdk.security.analyzer.SecurityAnalyzerBase` and
# `ReeflexConfirmationPolicy` subclasses `ConfirmationPolicyBase`. The floor is
# the version this package was written and measured against (1.56.0); nothing
# was run against an older one, and an unmeasured floor is a guess about
# somebody else's API. Bounded above at the next major.
#
# reeflex-claude: the ONE Reeflex classifier (`reeflex_claude.classify`), the
# same one the Claude Code hook and the LiteLLM seat use. This package adds no
# second classifier: an OpenHands action is expressed in that classifier's
# vocabulary (terminal -> Bash, file_editor -> Read/Write/Edit, ...) and priced
# there, so a fix to how a shell command is priced reaches this seat too.
# >=0.2.2 is the first published wheel carrying the RFX-158 fix (an
# unclassifiable command word is never priced as allow).
#
# Nothing from reeflex-core is imported: core is reached over HTTP only.
dependencies = [
    "openhands-sdk>=1.56,<2",
    "reeflex-claude>=0.2.2,<0.3",
]

[project.optional-dependencies]
# The real tool implementations (terminal, file_editor, browser). Only the
# end-to-end example needs them; the analyzer reads actions duck-typed.
tools = ["openhands-tools>=1.56,<2"]

[project.urls]
Homepage = "https://reeflex.io"
Source = "https://github.com/Reeflex-io/reeflex"
Issues = "https://github.com/Reeflex-io/reeflex/issues"
Documentation = "https://docs.reeflex.io/integrations/openhands/"
Changelog = "https://github.com/Reeflex-io/reeflex/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["reeflex_openhands*"]
