# Reeflex boundary gate for Devin (Cognition) pull requests -- RFX-450.
#
# Copy to .github/workflows/reeflex-boundary-gate.yml in the repository Devin
# works on, and copy reeflex_boundary_gate.py to .github/reeflex/. Then make
# the `reeflex-merge-gate` job a REQUIRED status check on the protected branch
# (Settings -> Branches -> branch protection, or a ruleset). Without that last
# step GitHub merges whatever this job says -- including a merge Devin performs
# itself through its GitHub integration.
#
# WHY pull_request_target AND NOT pull_request. With `pull_request`, GitHub
# runs the workflow file and the scripts from the PR's own merge ref, so a PR
# could edit this job into `exit 0` and pass its own gate. `pull_request_target`
# runs this file and the script from the BASE branch. Nothing from the PR is
# checked out or executed here: the changed paths are read through the API.
# Keep it that way -- do not add a step that checks out or runs PR code in
# this job, because this job holds the core token.
name: reeflex-boundary-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reeflex-merge-gate:
    runs-on: ubuntu-latest
    # Long enough for a human to answer; the script gives up at
    # REEFLEX_WAIT_SECONDS and fails the check (re-run the job to ask again).
    timeout-minutes: 45
    steps:
      - name: Check out the base branch (the gate's own copy, not the PR's)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/reeflex
          persist-credentials: false

      - name: List the files this pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' \
            > "$RUNNER_TEMP/changed.txt"
          wc -l < "$RUNNER_TEMP/changed.txt"

      - name: Ask Reeflex before this merge
        env:
          REEFLEX_CORE_URL: ${{ vars.REEFLEX_CORE_URL }}
          REEFLEX_CORE_TOKEN: ${{ secrets.REEFLEX_CORE_TOKEN }}
          REEFLEX_PORTAL_URL: https://app.reeflex.io/app/holds
          # Defaults shown; change them here, not in the script.
          REEFLEX_GATE_AUTHORS: devin-ai-integration[bot]
          REEFLEX_WAIT_SECONDS: "1800"
        run: python3 .github/reeflex/reeflex_boundary_gate.py merge --changed-files "$RUNNER_TEMP/changed.txt"

# The deploy half goes in your deploy workflow, as the step before the one
