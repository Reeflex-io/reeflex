[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-holds"
version = "0.2.0"
description = "MCP server exposing reeflex-core's Human-in-the-Loop (HIL) holds API -- list, inspect, and resolve Reeflex governance holds from any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reeflex" }]
keywords = ["reeflex", "mcp", "governance", "human-in-the-loop", "ai-agents"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# This is a thin MCP surface package (not reeflex-core, which stays
# dependency-free by contract). The official MCP Python SDK is the standard
# way to speak the protocol, so it is the ONE dependency here -- see
# reeflex-holds/README.md "Why the mcp SDK" for the rationale.
#
# mcp>=2 (RFX-26): this package ports to `mcp.server.mcpserver.MCPServer`,
# the post-2026-07-28-spec replacement for `mcp.server.fastmcp.FastMCP`
# (removed in mcp 2.0.0). The two APIs are not simultaneously importable
# from one `mcp` install (RFX-9 spike, dev-1--003), so the floor moves
# instead of widening -- this package no longer supports mcp<2. reeflex-mcp
# (the OTHER package on the old mcp<2 pin) is UNCHANGED and unaffected: it
# is pinned and tested independently (see gate.py's per-package venvs).
dependencies = [
    "mcp>=2",
]

[project.urls]
Homepage = "https://reeflex.io"
Repository = "https://github.com/Reeflex-io/reeflex"

[project.scripts]
reeflex-holds = "reeflex_holds.server:main"

[tool.setuptools.packages.find]
include = ["reeflex_holds*"]

# NOTE: this package IS published to PyPI -- https://pypi.org/project/reeflex-holds/
# -- and has been since 2026-07-04. The note that used to sit here said the
# opposite ("NOT yet published ... the name is not yet reserved"), and it was
# still saying it 22 hours after RFX-42 shipped the CLI to main, which is part
# of why nobody noticed that no released wheel contains that CLI (RFX-149):
# the packaging file itself said no customer could pip-install this.
#
# So: `version` above is the version this source tree WILL publish, not the
# one PyPI currently serves. They are routinely different, and each release
# is still an owner-gated human GO (docs/RELEASING.md) -- check
# https://pypi.org/project/reeflex-holds/#history for what users actually
# have. `pip install -e .` from this directory installs the tree, console
# script and `python -m reeflex_holds` entry point included.
