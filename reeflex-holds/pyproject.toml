[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-holds"
version = "0.2.0"
description = "MCP server exposing reeflex-core's Human-in-the-Loop (HIL) holds API -- list, inspect, and resolve Reeflex governance holds from any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reeflex" }]
keywords = ["reeflex", "mcp", "governance", "human-in-the-loop", "ai-agents"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# This is a thin MCP surface package (not reeflex-core, which stays
# dependency-free by contract). The official MCP Python SDK is the standard
# way to speak the protocol, so it is the ONE dependency here -- see
# reeflex-holds/README.md "Why the mcp SDK" for the rationale.
#
# mcp>=2 (RFX-26): this package ports to `mcp.server.mcpserver.MCPServer`,
# the post-2026-07-28-spec replacement for `mcp.server.fastmcp.FastMCP`
# (removed in mcp 2.0.0). The two APIs are not simultaneously importable
# from one `mcp` install (RFX-9 spike, dev-1--003), so the floor moves
# instead of widening -- this package no longer supports mcp<2. reeflex-mcp
# (the OTHER package on the old mcp<2 pin) is UNCHANGED and unaffected: it
# is pinned and tested independently (see gate.py's per-package venvs).
dependencies = [
    # UPPER BOUND ON PURPOSE. An open `>=2` let 2.1.1 arrive on a commit that
    # touched none of this package and turn three green tests red: the SDK now
    # masks an uncaught exception as "Error executing tool <name>", which for a
    # human-in-the-loop console means an operator cannot tell a typo from an
    # outage. server.py owns that behaviour now (`_surfaces_its_error`), but the
    # lesson is the floor: a dependency whose minor releases change what our
    # users SEE is not one to leave unbounded. Raise the ceiling deliberately,
    # after running the suite against the new minor.
    "mcp>=2,<2.2",
]

[project.urls]
Homepage = "https://reeflex.io"
Repository = "https://github.com/Reeflex-io/reeflex"

[project.scripts]
reeflex-holds = "reeflex_holds.server:main"

[tool.setuptools.packages.find]
include = ["reeflex_holds*"]

# NOTE: this package is NOT yet published to PyPI, and the name "reeflex-holds"
# is not yet reserved there (only reeflex / reeflex-core / reeflex-claude are).
# This file makes it pip-installable from source (`pip install -e .`) so
# `python -m reeflex_holds` and the `reeflex-holds` console script resolve
# once installed. Publishing to PyPI is a GATE (human GO required) -- not
# performed by this change.
