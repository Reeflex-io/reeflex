[build-system]
# Bounded above, matching the sweep in monorepo PR #129 (RFX-237): an open floor
# on the BUILD backend means the wheel a customer installs was assembled by a
# version nobody chose. The ceiling is that PR's measured one, adopted here so a
# package landing alongside it does not reintroduce the pattern it closes.
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "reeflex-litellm"
version = "0.2.0"
description = "Reeflex governance seat for an LLM gateway: a LiteLLM post-call guardrail that rules on every tool call the models behind the proxy propose (allow/deny/require_approval), fail-closed -- one integration for every agent behind the gateway."
readme = "README.md"
license = "Apache-2.0"
# >=3.10, NOT >=3.9, AND THE 3.9 CLASSIFIER IS GONE (RFX-248). This said
# `>=3.9` with a matching classifier while the `proxy` extra required
# `litellm[proxy]>=1.100,<2` — and litellm 1.100.0's own metadata declares
# `Requires-Python: >=3.10,<3.15` (read from the index, 2026-09-08). So on the
# interpreter this package advertised, `pip install 'reeflex-litellm[proxy]'`
# was unsatisfiable: an invitation to an install that cannot work.
#
# `requires-python` cannot differ per extra, so this is a choice, and it is
# made in the direction of the package's purpose: the only reason to install
# this is to run it inside a LiteLLM proxy, and litellm's floor is 3.10. A
# 3.9-installable base whose guardrail module cannot import is not support.
#
# Lowering the litellm floor instead (1.83.9 is the newest release admitting
# 3.9) was the alternative and was NOT taken: the floor comment below says an
# unmeasured floor is a guess about somebody else's API, and nothing here has
# been run against 1.83.
#
# The recurrence guard is that `release.yml`'s `verify-dist` job installs the
# `[proxy]` extra for real, and `scripts/verify_release_artifacts.py` compares
# this floor against litellm's own declared one — RFX-248's own note was that
# "a check that actually resolves the extra would be the thing that stops it
# recurring", and the gate deliberately never installs it.
requires-python = ">=3.10"
keywords = ["reeflex", "governance", "litellm", "llm-gateway", "ai-agent-safety", "tool-calls", "guardrail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# reeflex-claude carries the ONE classifier and the ONE envelope builder this
# package reuses (see reeflex_litellm/normalize.py and envelope.py).  It is a
# hard dependency for that reason and no other -- nothing about the Claude Code
# hook itself is used.
#
# Bounded above (see the build-system note). The API used is
# `classify.classify()`, `envelope.build_envelope()` and, in the contract test,
# `enforce.call_core_and_map()` -- the 0.1.x surface.
#
# THE FLOOR MOVED TO 0.2.0 AND THE CEILING WITH IT (RFX-224), and this is the
# whole of why. The previous requirement was `>=0.1.7,<0.2` with a comment
# saying, correctly, that 0.1.7 on PyPI was uploaded 2026-07-06 -- BEFORE
# RFX-144/145/146 landed on 2026-08-22 -- so the requirement resolved to a
# classifier that prices `echo x && rm -rf /var/lib/pgsql` as
# reversible/single, which core then ALLOWS (measured; RFX-241;
# tests/test_classifier_vintage.py is the tripwire that fails on that wheel).
# It ended: "the floor cannot be raised to exclude it until a fixed wheel is
# published."
#
# RFX-224 bumps `reeflex-claude` to **0.2.0**, whose tree contains RFX-144/145/
# 146 -- so the floor CAN now be raised, and the ceiling HAD to move anyway:
# `<0.2` made 0.2.0 unresolvable and turned the repo gate's `pytest-litellm`
# leg red (the gate installs both packages editable into one venv, so a
# sibling's minor bump is an unsatisfiable resolve, not a warning). Caught by
# `python gate.py`, not by either package's own suite -- neither one can see
# this pair.
#
# `>=0.2.0` excludes the stale wheel BY VERSION rather than by relying on the
# checkout winning a resolve, which is what RFX-241 asked for. It is not
# closed yet: this only becomes true on the index once the console publishes
# 0.2.0 (release is console-sequenced), and `reeflex-litellm` is itself on no
# index, so nothing installs this from PyPI today either way.
#
# THE FLOOR MOVED AGAIN, TO 0.2.1, AND THE LAST SENTENCE ABOVE STOPPED BEING
# TRUE THE DAY IT WAS WRITTEN (RFX-326). `reeflex-litellm 0.1.0` was uploaded to
# PyPI on 2026-09-16T06:29:54Z. From that moment the `>=0.2.0` floor was no
# longer a statement about a package nobody could install: it was the floor a
# real `pip install reeflex-litellm` resolved against, and the newest wheel
# satisfying it -- `reeflex-claude 0.2.0`, uploaded 23 seconds earlier the same
# morning -- PREDATES RFX-301 by a day.
#
# Measured 2026-09-17 on that exact resolve, driven through this package's own
# `reeflex-litellm decide` against a core running the live image: 23 of qa-211's
# 24 destructive command-substitution lines came back `allow`, most under
# `reeflex.policy/read_only_internal`. `echo $(rm -rf /var/lib/pgsql)` was one
# of them. Nothing in this package and nothing in core was at fault; the floor
# admitted a classifier that reads only the outer command word.
#
# `reeflex_claude` 0.2.1 is the first version whose tree carries RFX-301
# (`_substitution_bodies`, commit f1cb5bb 2026-09-17 09:00; the version bump to
# 0.2.1 came later the same day in 7efbeaf), so >=0.2.1 excludes the mispricing
# BY VERSION. Until the console publishes 0.2.1 this floor makes
# `pip install reeflex-litellm` FAIL rather than resolve a classifier that
# misprices a delete -- which is the direction this package fails in everywhere
# else. Both distributions ship from the same monorepo tag, so a release that
# publishes this package publishes a `reeflex-claude` that satisfies it.
#
# A floor is still only a declaration about somebody else's index. The
# measurement that goes with it is `reeflex_litellm/vintage.py`, which scores
# the classifier ACTUALLY LOADED in the process on every seat's first call and
# refuses the call if it misprices the canaries.
dependencies = [
    "reeflex-claude>=0.2.1,<0.3",
]

# litellm is OPTIONAL on purpose.  The decision logic (normalize / envelope /
# core / enforce / response) imports nothing from it and is tested without it,
# so the repo gate does not pay a multi-hundred-megabyte install to run this
# package's suite.  Only reeflex_litellm.guardrail needs it, and only inside a
# running proxy.
#
# The floor is the version this package's LiteLLM-contract tests were actually
# run against (1.100.0), not the oldest version that might work -- an unmeasured
# floor is a guess about somebody else's API. Widen it downward after running
# tests/test_litellm_contract.py on the older release, not before. Bounded above
# because the hook signature, the `guardrail:` dotted-path loader and
# `CustomGuardrail` are 1.x contracts.
[project.optional-dependencies]
proxy = ["litellm[proxy]>=1.100,<2"]

[project.urls]
Homepage = "https://reeflex.io"
Source = "https://github.com/Reeflex-io/reeflex"
Issues = "https://github.com/Reeflex-io/reeflex/issues"
Documentation = "https://github.com/Reeflex-io/reeflex/tree/main/reeflex-litellm"
Changelog = "https://github.com/Reeflex-io/reeflex/blob/main/CHANGELOG.md"

[project.scripts]
reeflex-litellm = "reeflex_litellm.cli:main"
# The connector: the same decision, served over LiteLLM's Generic Guardrail API
# so nothing has to be installed inside the customer's LiteLLM container. It is
# a console script and not an extra because it needs NO dependency litellm
# would bring -- the whole point is that this process is not a proxy.
reeflex-connector = "reeflex_litellm.connector:main"

[tool.setuptools.packages.find]
include = ["reeflex_litellm*"]
