# smoke-pypi.yml — fresh-install smoke test of the PUBLISHED PyPI artifacts.
# Deliberately NOT paths:-filtered and scheduled daily: an upstream dependency
# release (e.g. mcp 2.0.0 on 2026-07-28) must be able to turn CI red without
# anyone touching this repo. Installs from PyPI — never from the working tree —
# and INVOKES each entry point; "the file exists" is not proof (WoW §18.5).
# `workflow_call` so the future uniform preflight gate (TICKET P1) can invoke
# this job instead of reimplementing it.
#
# WHAT A GREEN RUN HERE DOES NOT MEAN (RFX-246). It installs whatever PyPI
# serves as LATEST — it pins no version and takes no input — so:
#
#   * It cannot tell you a release shipped. Run it the minute after a tag whose
#     packages did not move and it is green against the PREVIOUS versions. On
#     `Release v0.2.0`, two of these three were skipped as already-existing;
#     a green smoke afterwards was measuring 0.1.7 and 0.1.3, which is exactly
#     what it should measure and is not evidence about 0.2.0.
#   * It asserts `--help` exits 0. That catches import-time death and nothing
#     else. A gate that fails to REFUSE exits 0 on `--help`.
#
# It is the right instrument for "did an upstream release break what customers
# already have", and the wrong one for "is this release healthy".

name: smoke-pypi

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-pypi:
    name: pip install ${{ matrix.package }} (PyPI) + invoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three packages this repo PUBLISHES to PyPI (RFX-18): a broken
        # fresh install of any of them turns CI red on its own.
        #
        # NOT "all three packages a human can pip install", which is what this
        # comment used to say and is false (RFX-246). A FOURTH name resolves:
        # `pip install reeflex-core` succeeds and installs 0.0.1 — a name
        # reservation uploaded 2026-07-04, 1829 bytes, no executable behavior.
        # It is absent from this matrix on purpose: it has no console script to
        # invoke, and release.yml builds no dist for it (core's artefact is the
        # GHCR image). The honest summary is that PyPI serves four Reeflex
        # names, three of which are the product and one of which is a
        # placeholder that has never moved.
        package: [reeflex-mcp, reeflex-holds, reeflex-claude]
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No checkout: the whole point is testing what a user gets from
      # `pip install <package>` today, independent of the repo state.
      - name: Fresh venv + install from PyPI
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/pip install --no-cache-dir "${{ matrix.package }}"

      - name: Show resolved versions (diagnosability)
        # `pip show mcp` so a future red run is diagnosable from the log alone
        # (the 2026-07-28 breakage was an unbounded `mcp` resolving to 2.0.0).
        # reeflex-claude has no third-party runtime deps (stdlib only), so it
        # has no `mcp` to show -- skip that line for it rather than fail on
        # "Package(s) not found".
        run: |
          smoke-venv/bin/pip show "${{ matrix.package }}"
          if [ "${{ matrix.package }}" != "reeflex-claude" ]; then
            smoke-venv/bin/pip show mcp
          fi
          smoke-venv/bin/pip freeze

      - name: Invoke the published entry point
        run: |
          smoke-venv/bin/${{ matrix.package }} --help
          echo "OK: ${{ matrix.package }} --help exited 0"
