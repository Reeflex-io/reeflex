# ci.yml — Reeflex CI: OPA policy tests + Python unit tests.
# Runs on every push to main and on pull requests targeting main, plus manual dispatch.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push/PR update cancels the older run
# (prevents duplicate/stacked runs on rapid updates).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # RFX-134: cancel a pull request's superseded run, NEVER a push to main.
  # `github.ref` is `refs/heads/main` for every merge, so an unconditional
  # `true` means the second merge of the day cancels the first merge commit's
  # run -- reported by GitHub as `cancelled`, not `failure`, so main does not
  # go red and nobody is emailed. Measured 2026-09-20 over each workflow's
  # whole main-push history: ci.yml 13 cancelled of 195, gate.yml 8 of 113,
  # reeflex-app's ci.yml 16 of 113. All 37 of those commits are on main today
  # with no successful run of that workflow at that sha. c76ad2d8 (2026-09-17)
  # is the one to remember: the gate was RE-RUN and `run_attempt: 2` was
  # cancelled too. Proved on a real runner, two pushes seven seconds apart --
  # `true` cancels run 1, this expression lets both finish (run 2 queues).
  # `docs.yml` already carried this line; guarded by
  # scripts/check_workflow_concurrency.py.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opa-policy-tests:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.18.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Run OPA policy tests
        run: opa test reeflex-core/policy/ -v

  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: opa-policy-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OPA (required by the tests — real subprocess, no mock)
        run: |
          curl -sL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.18.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # RFX-27: this used to name 5 modules explicitly (test_decide/test_auth/
      # test_hardening/test_telemetry/test_hil) and silently drifted behind the
      # tree — 4 modules added later (test_audit_enrichment_v0113,
      # test_hold_consume_cas, test_kill_switch_wiring, test_traceability) never
      # ran here. gate.py's unittest-core component already used full discovery
      # and caught all 9; this job now matches it so it cannot drift again.
      - name: "Run Python unit tests (core engine — full discovery, mirrors gate.py's unittest-core)"
        working-directory: reeflex-core
        env:
          REEFLEX_OPA_BIN: opa
          REEFLEX_POLICY_DIR: policy
        run: python -m unittest discover -s tests -t . -v
