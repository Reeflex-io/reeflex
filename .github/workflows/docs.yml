name: Docs

# Docs-as-code: any push to main that touches docs/, mkdocs.yml, or this
# workflow rebuilds and deploys docs.reeflex.io. No manual publishing step.
#
# THE `pull_request` TRIGGER IS NEW, and it is here for a measured reason.
# Until now this workflow could only run AFTER a merge, so a docs regression
# could only ever be discovered by turning `main` RED — which is exactly what
# happened once already (dev-3 round 039 had to fix-forward through #128, and
# recorded the missing trigger as still-open). The build's dependencies were
# also two unbounded floors (`pip install "mkdocs-material[imaging]" ...`), the
# worst case of the PR #123 class: nothing this side of a merge could have
# caught an upstream release. They are now pinned in
# `.github/requirements-docs.txt`, and this trigger is what makes that pin, and
# every future docs change, verifiable BEFORE it lands.
#
# On a pull request the BUILD runs and the DEPLOY does not: the three
# Pages-touching steps and the whole `deploy` job are gated on the event, so a
# PR can never publish to docs.reeflex.io.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/requirements-docs.txt"
      - ".github/requirements-docs-probe.txt"
      # The `hooks:` entry in mkdocs.yml runs this on every build; without it
      # here, a change to the checker itself would rebuild nothing and the
      # first run of a new rule would be the merge to main (RFX-268).
      - "scripts/check_diagram_contrast.py"
      # Same reasoning for the pixel probe and the worklist it reads (RFX-266):
      # a change to either must re-run against the built site.
      - "scripts/probe_diagrams.py"
      - "scripts/diagram_probe_baseline.json"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".github/requirements-docs.txt"
      - ".github/requirements-docs-probe.txt"
      - "scripts/check_diagram_contrast.py"
      - "scripts/probe_diagrams.py"
      - "scripts/diagram_probe_baseline.json"
  workflow_dispatch:

# Deploy via the GitHub Pages artifact path (actions/deploy-pages) — no
# gh-pages branch clutter in the repo history. On a `pull_request` event the
# token is read-only anyway and no Pages step runs; the write scopes here are
# for the push-to-main path.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time on main, and don't cancel an in-flight publish. PR
# builds get their own per-ref group so they neither queue behind a publish nor
# block one, and a superseded PR build is cancelled rather than paid for.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git-revision-date-localized works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Imaging libraries for the Material "social" plugin (auto OG cards).
      - name: Install imaging libraries (social cards)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev pngquant

      # Bounded floors, in a file `scripts/check_dependency_floors.py` walks.
      # `--upgrade pip` stays: pip is the resolver, not a dependency of the
      # docs, and an old pip is a resolve failure rather than a silent
      # behaviour change.
      - name: Install MkDocs Material + plugins (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-docs.txt

      - name: Show what resolved (so a future red run is diagnosable from the log)
        run: pip freeze

      # CI=true flips the `social` plugin on (enabled: !ENV [CI, false]).
      # --strict fails the build on any broken link or missing reference.
      - name: Build (strict)
        env:
          CI: "true"
        run: mkdocs build --strict

      - name: Add CNAME (custom domain)
        if: github.event_name != 'pull_request'
        run: echo "docs.reeflex.io" > site/CNAME

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  # WHAT A READER ACTUALLY SEES (RFX-266). `build` proves mkdocs is happy and
  # the `hooks:` checker is happy; neither of them renders anything. This job
  # opens the built site in Chromium and measures pixels: painted contrast per
  # diagram label in BOTH palettes, effective label size after mermaid's
  # shrink-to-fit, and that every diagram rendered at all.
  #
  # It exists because four rounds in a row each wrote this measurement from
  # scratch into a report folder, and three of the defects those rounds found
  # were in the instrument rather than in the docs. scripts/probe_diagrams.py
  # carries each of those traps as a behaviour; this job is what runs it.
  #
  # IT DOES NOT GATE PUBLICATION, deliberately. `deploy` needs `build` only, so
  # a red probe turns a PULL REQUEST red — which is where a diagram regression
  # should be caught — without letting a third-party font CDN or a Chromium
  # download failure hold up a docs deploy. The cheap static check in
  # scripts/check_diagram_contrast.py does gate the build, and this job is the
  # pixel authority that keeps that check's model honest.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + the probe (both pinned, separate files)
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-docs.txt \
                      -r .github/requirements-docs-probe.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # No CI=true here: the `social` plugin renders OG cards, which this job
      # does not measure and which would need the imaging apt packages. The
      # diagrams, the stylesheet and the palette toggle are identical either way.
      - name: Build the site to measure
        run: mkdocs build --strict -d site

      # --require-webfont: theme.font.text is Inter, fetched from Google Fonts.
      # With it unreachable the page renders in fallback metrics, diagrams come
      # out up to 3.2% wider and every effective label size shrinks with them.
      # That is measurable, so it is measured rather than silently absorbed.
      - name: Probe the rendered diagrams
        run: |
          python scripts/probe_diagrams.py site \
            --require-webfont \
            --json diagram-probe.json \
            --screenshots diagram-probe-shots

      # The screenshots are the point: a contrast or size finding is a claim
      # about a picture, and the picture should be one click away from the red
      # run rather than something the next person rebuilds to see.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-probe
          path: |
            diagram-probe.json
            diagram-probe-shots/
          retention-days: 14

  deploy:
    # A pull request BUILDS the docs and never publishes them.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
