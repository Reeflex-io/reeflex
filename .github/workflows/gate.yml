# gate.yml — the uniform preflight gate in CI (TICKET P1+P2, WoW §18.5 / §14.6).
#
# Deliberately NOT paths:-filtered: a green gate means the WHOLE tree, not the
# touched slice. The per-package workflows (ci.yml, ci-reeflex-mcp.yml) keep
# their scope/paths for fast targeted feedback; this workflow is the honest
# full gate on every PR and every push to main.
#
# DoD(4): the fresh-install-from-PyPI smoke is NOT reimplemented here — the
# smoke-pypi job below INVOKES .github/workflows/smoke-pypi.yml (workflow_call,
# shipped exactly for this purpose). The gate job runs with --pypi delegated,
# which prints the delegation instead of keeping a second copy of the smoke.
# NOTE: the smoke tests the PUBLISHED artifacts — it stays RED until the fixed
# versions ship to PyPI, independent of the tree under review. Red there means
# "the published packages are broken", not "this PR is broken".
#
# RFX-105 / RFX-106 — THE WORDPRESS HARNESSES NOW ACTUALLY RUN HERE.
# They used to be an "allowed, printed skip" on the grounds that they need a
# LIVE reeflex-core. That was true and it was also the whole problem: the
# allowance meant the four PHP harnesses ran in NO automation at all, on any
# workflow, ever — while release.yml publishes that same plugin to
# wordpress.org. One of them (fanout-regression-demo.php) had been fatally
# broken for an unknown period and only turned up when a human ran it by hand.
# reeflex-core is a stdlib HTTP server with no dependencies beyond opa, which
# this job already installs, so "needs a live core" costs ~5 seconds: the step
# below starts one on 127.0.0.1:8099 and passes --core-url. Measured: all four
# harnesses complete in ~2 minutes.
#
# REEFLEX_HOLD_TTL_SECONDS=20 is set on BOTH the core and the gate step
# deliberately. conformance-demo.php's H9 (an EXPIRED approved hold must be
# refused by resubmit_hold()) SKIPS itself unless the TTL is <=60 — it will not
# sleep out a 4h production TTL — and the harness still printed "ALL HOLD
# SCENARIOS PASS" with H9 skipped. That is a silent skip nested inside an
# always-skipped component, on the fail-open path the whole RFX-64/65/66/67
# expiry chain exists to close. With the short TTL, H9 runs and passes.
#
# migration-heads (RFX-49) is also an ALLOWED, PRINTED skip: it validates
# the private reeflex-app repo's alembic graph IF that repo is checked out
# next to this one, which it never is on this public repo's own runner.
# The migration-heads-selftest component (proving the checker tool itself
# is correct) is NOT skippable — it runs here unconditionally. reeflex-app's
# own CI (Reeflex-io/reeflex-app, ci.yml) runs the enforcing copy of the
# check directly against its own migrations on every PR.

name: gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NO paths: filter — see the header comment.

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight-gate:
    name: preflight gate (env + full suite + built entry points)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22 (n8n-nodes-reeflex needs >=20.15)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OPA (same version ci.yml pins)
        run: |
          curl -sL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.18.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Ensure a php CLI (the WordPress live-core harnesses need it)
        run: php --version || (sudo apt-get update -qq && sudo apt-get install -y -qq php-cli && php --version)

      - name: Gate selftest — prove the anchored, case-sensitive parsing (DoD 5)
        run: python gate.py --selftest

      - name: Census selftest — prove every silent-skip detector (RFX-87)
        # Same pattern, one layer down: check_test_census.py is what stops a
        # test file from sitting in the right directory while collecting zero
        # tests (PR #89's regression guard did exactly that for its whole
        # life). Its detectors are proved on synthetic fixtures before the
        # census verdict is trusted.
        run: python scripts/check_test_census.py --selftest

      - name: Start a local reeflex-core for the WordPress harnesses
        working-directory: reeflex-core
        env:
          REEFLEX_PORT: "8099"
          REEFLEX_HOLD_TTL_SECONDS: "20"   # lets conformance-demo.php's H9 run — see header
          REEFLEX_POLICY_DIR: policy
          REEFLEX_AUDIT_LOG: /tmp/gate-core-audit.jsonl
          # RFX-84 / 0.2.0: REEFLEX_REQUIRE_VERIFIED_APPROVER now defaults to
          # TRUE, and all four WordPress harnesses resolve a hold. This binds
          # each harness principal's bearer token to the principal it IS, so
          # the harnesses resolve as VERIFIED approvers. wp-stubs.php reads the
          # SAME file to decide which token to send, so the two sides cannot
          # drift. Deliberately NOT the opt-out: the gate must exercise the
          # configuration we ship, or the default is tested by nothing.
          REEFLEX_RESOLVER_TOKENS: ${{ github.workspace }}/reeflex-wordpress/tests/harness-resolver-tokens.json
        run: |
          nohup python main.py > /tmp/gate-core.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/healthz; then
              echo "reeflex-core is up"; exit 0
            fi
            sleep 1
          done
          echo "::error title=reeflex-core did not start::the WordPress harnesses cannot run without it"
          cat /tmp/gate-core.log
          exit 1

      - name: Run the gate
        env:
          # Must match the core started above: the harness reads this to decide
          # whether H9 is runnable, the core reads it to set the actual TTL.
          REEFLEX_HOLD_TTL_SECONDS: "20"
        # wp-conformance is NO LONGER in --allow-skips: it runs for real now.
        # migration-heads stays allowed — it validates the PRIVATE reeflex-app
        # repo's alembic graph, which is never checked out on this runner, and
        # reeflex-app's own ci.yml runs the enforcing copy on every PR.
        run: |
          python gate.py --pypi delegated \
            --allow-skips migration-heads \
            --core-url http://127.0.0.1:8099

      - name: reeflex-core log (always, so a harness failure is diagnosable)
        if: always()
        run: cat /tmp/gate-core.log || true

  smoke-pypi:
    name: fresh-install-from-PyPI smoke
    # DoD(4) by INVOCATION, not reimplementation (§22.6 collision guard).
    uses: ./.github/workflows/smoke-pypi.yml
