# ci-reeflex-mcp.yml — CI for the reeflex-mcp gateway.
# A SEPARATE workflow (not folded into ci.yml) so the `paths:` filter keeps it
# from running on PRs that do not touch the gateway — unrelated PRs stay fast,
# while every PR that changes reeflex-mcp/** gates on its own test suite.

name: CI — reeflex-mcp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reeflex-mcp/**"
      - ".github/workflows/ci-reeflex-mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "reeflex-mcp/**"
      - ".github/workflows/ci-reeflex-mcp.yml"

concurrency:
  group: ci-mcp-${{ github.workflow }}-${{ github.ref }}
  # RFX-134: cancel a pull request's superseded run, NEVER a push to main.
  # `github.ref` is `refs/heads/main` for every merge, so an unconditional
  # `true` means the second merge of the day cancels the first merge commit's
  # run -- reported by GitHub as `cancelled`, not `failure`, so main does not
  # go red and nobody is emailed. Measured 2026-09-20 over each workflow's
  # whole main-push history: ci.yml 13 cancelled of 195, gate.yml 8 of 113,
  # reeflex-app's ci.yml 16 of 113. All 37 of those commits are on main today
  # with no successful run of that workflow at that sha. c76ad2d8 (2026-09-17)
  # is the one to remember: the gate was RE-RUN and `run_attempt: 2` was
  # cancelled too. Proved on a real runner, two pushes seven seconds apart --
  # `true` cancels run 1, this expression lets both finish (run 2 queues).
  # `docs.yml` already carried this line; guarded by
  # scripts/check_workflow_concurrency.py.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reeflex-mcp-tests:
    name: reeflex-mcp unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reeflex-mcp + pytest (pinned)
        working-directory: reeflex-mcp
        # Editable install pulls the runtime deps (mcp, pyyaml); pytest is the runner.
        # The suite is pure-Python (no OPA/core needed) — the gateway's fail-closed
        # and normalization paths are exercised against in-process stubs.
        #
        # pytest is BOUNDED (the PR #123 sweep). It was a bare `pytest`, so the
        # runner that judges this package was re-resolved to whatever was newest
        # on every run. `>=8,<10` is the range MEASURED green on this suite:
        # 342 passed on 8.4.2 and 342 passed on 9.1.1 (2026-09-08). Widen it
        # after running the suite on the new major, not before.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<10"

      - name: Show what resolved (diagnosability)
        run: python -m pip freeze

      - name: Run reeflex-mcp unit tests
        working-directory: reeflex-mcp
        run: python -m pytest tests/ -q
